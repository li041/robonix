#
# Network bridge overlay. The simulator owns the rmw_zenohd router.
# Keep published endpoints on loopback unless a remote host is configured.
services:
  sim:
    ports:
      - "${ROBONIX_ADVERTISE_HOST:-127.0.0.1}:${ROBONIX_SIM_ZENOH_PORT:-7447}:7447"
      - "${ROBONIX_ADVERTISE_HOST:-127.0.0.1}:40101-40104:40101-40104"
      - "${ROBONIX_ADVERTISE_HOST:-127.0.0.1}:40112:40112"
      - "${ROBONIX_ADVERTISE_HOST:-127.0.0.1}:40113:40113"
